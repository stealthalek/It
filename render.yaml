services:
  - type: web
    name: it-ticketing-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DEFAULT_ADMIN_EMAIL
        value: admin@ticketing.local
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
