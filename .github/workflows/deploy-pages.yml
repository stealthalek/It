name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [master, main]
    paths:
      - "public/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build minified frontend
        run: |
          mkdir -p dist
          cp -r public/. dist/
          npx --yes terser@5 public/js/app.js --compress --mangle --output dist/js/app.js
          npx --yes clean-css-cli@5 -o dist/css/style.css public/css/style.css
          sed -i "s/const CACHE_NAME = '.*';/const CACHE_NAME = 'ticketing-static-${GITHUB_SHA::12}';/" dist/service-worker.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site (dist/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
