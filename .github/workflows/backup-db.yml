name: Backup database

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Warn if Turso secrets are missing
        if: ${{ secrets.TURSO_DATABASE_URL == '' }}
        run: |
          echo "Secret TURSO_DATABASE_URL non impostato (Settings -> Secrets and variables -> Actions): salto il backup."

      - name: Run backup
        if: ${{ secrets.TURSO_DATABASE_URL != '' }}
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: npm run backup:db

      - name: Upload backup artifact
        if: ${{ secrets.TURSO_DATABASE_URL != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backups/*.json
          retention-days: 30
