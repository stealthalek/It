<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ticketing · Assistenza</title>
<meta name="description" content="Piattaforma di ticketing per la gestione di richieste di assistenza, utilizzabile da desktop, tablet e smartphone." />
<meta name="theme-color" content="#8f2436" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link id="fontPreload" rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" />
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" /></noscript>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="img/icon.svg" type="image/svg+xml" />
<link rel="icon" href="img/icon-192.png" sizes="192x192" type="image/png" />
<link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ticketing" />
<meta name="mobile-web-app-capable" content="yes" />
<script src="js/head-init.js"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-shell">
  <div id="sidebarBackdrop" class="sidebar-backdrop" hidden></div>
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-head">
      <a href="#/dashboard" class="brand">
        <img src="img/icon.svg" alt="" width="28" height="28" />
        <span class="brand-label">Ticketing</span>
      </a>
      <button id="sidebarCollapseBtn" class="sidebar-collapse-btn" type="button" title="Comprimi menu" aria-label="Comprimi menu"></button>
    </div>
    <nav id="mainNav" class="main-nav">
      <div class="nav-section-label" data-nav-section="work"></div>
      <a href="#/dashboard" data-nav="dashboard" class="logged-in-only" data-nav-group="work"></a>
      <a href="#/new" data-nav="new" class="logged-in-only" data-nav-group="work"></a>
      <a href="#/announcements" data-nav="announcements" class="logged-in-only" data-nav-group="work"></a>
      <div class="nav-section-label" data-nav-section="team"></div>
      <a href="#/directory" data-nav="directory" class="logged-in-only" data-nav-group="team"></a>
      <a href="#/messages" data-nav="messages" class="logged-in-only" data-nav-group="team"></a>
      <a href="#/orgchart" data-nav="orgchart" class="logged-in-only" data-nav-group="team"></a>
      <a href="#/onboarding" data-nav="onboarding" class="onboarding-nav" data-nav-group="team"></a>
      <div class="nav-section-label" data-nav-section="tools"></div>
      <a href="#/timesheet" data-nav="timesheet" class="logged-in-only" data-nav-group="tools"></a>
      <a href="#/rooms" data-nav="rooms" class="logged-in-only" data-nav-group="tools"></a>
      <a href="#/ideas" data-nav="ideas" class="logged-in-only" data-nav-group="tools"></a>
      <a href="#/wiki" data-nav="wiki" class="logged-in-only" data-nav-group="tools"></a>
      <a href="#/search" data-nav="search" class="staff-only" data-nav-group="tools"></a>
      <a href="#/assets" data-nav="assets" class="staff-only" data-nav-group="tools"></a>
      <a href="#/report" data-nav="report" class="insights-nav" data-nav-group="tools"></a>
      <div class="nav-section-divider" data-nav-section="account"></div>
      <a href="#/admin" data-nav="admin" class="staff-only" data-nav-group="account"></a>
      <a href="#/profile" data-nav="profile" class="logged-in-only" data-nav-group="account"></a>
    </nav>
    <a id="sidebarSystemStatus" href="#/admin" class="sidebar-system-status" hidden>
      <span class="sidebar-status-dot"></span>
      <span class="sidebar-status-text"></span>
    </a>
    <div class="sidebar-foot">
      <span id="userBadge" class="user-badge"></span>
      <button id="logoutBtn" class="btn btn-ghost"></button>
    </div>
  </aside>
  <div class="shell-main">
    <header class="topbar">
      <div class="topbar-inner">
        <button id="navToggle" class="nav-toggle" aria-label="Apri menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <div class="topbar-spacer"></div>
        <button id="quickJumpBtn" class="topbar-icon-btn" type="button" title="Ricerca rapida (Ctrl+K)" aria-label="Ricerca rapida" style="display:none"></button>
        <button id="installBtn" class="topbar-icon-btn" type="button" title="Installa l'app" aria-label="Installa l'app" style="display:none"></button>
        <div class="notif-wrap">
          <button id="notifBtn" class="topbar-icon-btn" type="button" title="Notifiche" aria-label="Notifiche" style="display:none">
            <span id="notifBadge" class="notif-badge" hidden></span>
          </button>
          <div id="notifDropdown" class="notif-dropdown" hidden></div>
        </div>
        <button id="themeToggleBtn" class="topbar-icon-btn" type="button" title="Cambia aspetto" aria-label="Cambia aspetto chiaro/scuro"></button>
        <button id="settingsBtn" class="topbar-icon-btn" type="button" title="Impostazioni" aria-label="Impostazioni"></button>
      </div>
    </header>

    <div id="ticketTabStrip" class="ticket-tab-strip" hidden></div>
    <div id="viewAsBanner" class="viewas-banner" hidden></div>
    <main id="app" class="app-main"></main>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="messagePopupStack" class="message-popup-stack" aria-live="polite"></div>

<div id="quickJumpOverlay" class="cmdk-overlay" hidden>
  <div class="cmdk-modal" role="dialog" aria-modal="true">
    <input id="quickJumpInput" class="cmdk-input" type="text" autocomplete="off" />
    <div id="quickJumpResults" class="cmdk-results"></div>
  </div>
</div>

<script src="js/app.js" defer></script>
</body>
</html>
